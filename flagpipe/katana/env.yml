# flagpipe conda environment (built by setup_env.pbs into $FLAGPIPE_ENV).
# Versions match the thesis run where it matters: IQ-TREE 2.4.0, MAFFT 7.526,
# trimAl 1.5.0, eggNOG-mapper 2.1.13 (eggNOG 5.0.2 database), OrthoFinder 3.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - biopython
  - numpy
  - matplotlib
  - ete3=3.1.3
  - orthofinder>=3.0
  - diamond
  - eggnog-mapper=2.1.13
  - mafft=7.526
  - trimal=1.5.0
  - iqtree=2.4.0
